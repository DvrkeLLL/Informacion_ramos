<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ramos U — Editar Ramos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5F1;
    --ink:#1B2A22;
    --ink-soft:#5E6E63;
    --accent:#2F6E4E;
    --accent-dark:#215239;
    --accent-wash:rgba(47,110,78,0.12);
    --on-accent:#FFFFFF;
    --danger:#B5473A;
    --card:#FFFFFF;
    --border:#D9E0D6;
    --th-bg:#E9EEE6;
    --pastel-green-bg:#D9F0DF;
    --pastel-green-ink:#2F6E4E;
    --pastel-orange-bg:#FBE4C8;
    --pastel-orange-ink:#B0692A;
    --radius:20px;
    --radius-sm:14px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#DEE3DA;font-family:var(--font-body);color:var(--ink);}
  #phone{
    max-width:430px;
    margin:0 auto;
    height:100vh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,0.15);
  }
  #scrollArea{
    flex:1;
    overflow-y:auto;
    padding-bottom:104px;
  }

  header{ padding:34px 22px 16px; }
  header h1{
    font-family:var(--font-display);
    font-size:27px;
    font-weight:800;
    letter-spacing:0.01em;
    margin:0;
    color:var(--ink);
  }
  header .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:5px; }
  header.header-center{ text-align:center; }

  main{ padding:6px 18px 0; }
  .ramo-wrap{
    position:relative;
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
  }
  .ramo-delete-bg{
    position:absolute;
    inset:0;
    background:var(--danger);
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:22px;
    color:#fff;
    font-weight:700;
    font-family:var(--font-display);
    font-size:13px;
    cursor:pointer;
  }
  .ramo-card, .add-card{
    min-height:84px;
    border-radius:var(--radius);
    margin-bottom:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    transition:transform .12s ease;
    touch-action:pan-y;
    position:relative;
  }
  .ramo-wrap .ramo-card{ margin-bottom:0; }
  .ramo-card{
    background:var(--card);
    border:1px solid var(--border);
    padding:14px 18px;
  }
  .ramo-card:active{transform:none;}
  .ramo-card .name{font-weight:700;font-size:15.5px;font-family:var(--font-display);}
  .ramo-card .meta{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  .add-card{
    border:2px solid var(--accent);
    color:var(--accent-dark);
    background:var(--accent-wash);
    margin-bottom:12px;
  }
  .add-card svg{width:26px;height:26px;}
  .add-card:active{background:var(--accent);color:#fff;}

  nav{
    position:absolute;
    left:16px; right:16px; bottom:16px;
    display:flex;
    background:var(--ink);
    border-radius:26px;
    padding:10px 8px;
    box-shadow:0 10px 30px rgba(27,42,34,0.35);
    z-index:10;
  }
  nav .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    color:rgba(255,255,255,0.55);
    cursor:pointer;
    font-size:9.5px;
    font-weight:700;
    font-family:var(--font-display);
  }
  nav .tab svg{width:20px;height:20px;}
  nav .tab.active{color:#fff;}
  nav .icon-wrap{
    width:38px;height:28px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
  }
  nav .tab.active .icon-wrap{background:var(--accent);}

  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:20px 18px 10px;
  }
  .back{
    width:36px;height:36px;border-radius:12px;
    border:1px solid var(--border);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--ink);
    flex-shrink:0;
  }
  .back svg{width:20px;height:20px;display:block;}
  .topbar h2{font-family:var(--font-display);font-size:19px;margin:0;font-weight:700;}

  .section-btn{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;margin:0 18px 12px;
    display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;
  }
  .section-btn .label{font-weight:700;font-size:14.5px;font-family:var(--font-display);}
  .section-btn .status{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .section-btn .status.ok{color:var(--accent-dark);font-weight:600;}

  .inline-form{margin:0 18px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .inline-form label{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .inline-form input, .inline-form select{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:14.5px;font-family:var(--font-body);margin-bottom:12px;background:#fff;color:var(--ink);
  }
  .btn-primary{
    background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius-sm);
    padding:13px 16px;font-weight:700;font-family:var(--font-display);font-size:14px;cursor:pointer;width:100%;
  }
  .btn-primary:active{background:var(--accent-dark);}
  .btn-ghost{
    background:transparent;color:var(--ink-soft);border:1.5px solid var(--border);
    border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-display);
  }

  .table-wrap{margin:0 18px 14px;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);}
  table{border-collapse:collapse;width:100%;min-width:560px;}
  th{
    background:var(--th-bg);font-size:10.5px;text-transform:uppercase;letter-spacing:0.03em;
    color:var(--ink-soft);padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);
    position:sticky;top:0;font-family:var(--font-display);
  }
  td{padding:6px 8px;border-bottom:1px solid var(--border);font-size:13px;}
  td input, td select{
    width:100%;border:1px solid transparent;background:transparent;font-size:13px;
    padding:6px 5px;border-radius:9px;font-family:var(--font-body);color:var(--ink);
  }
  td input:focus, td select:focus{border-color:var(--accent);background:#fff;outline:none;}
  td input.suggested{color:var(--ink-soft);font-style:italic;}
  .num-cell{color:var(--ink-soft);font-weight:700;text-align:center;width:34px;}
  .fecha-cell{display:flex;flex-direction:column;gap:5px;min-width:126px;padding:6px 4px;}
  .fecha-cell input{
    padding:7px 6px;font-size:12px;
    border:1px solid var(--border) !important;
    background:#fff !important;
    -webkit-appearance:none;
    appearance:none;
    color:var(--ink);
  }

  .save-bar{margin:0 18px 24px;display:flex;gap:10px;}
  .save-bar .btn-primary{flex:1;}
  .warn{
    margin:0 18px 14px;background:#FBEAE7;border:1px solid var(--danger);color:var(--danger);
    padding:11px 12px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;
  }
  .toast{
    position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;
    font-family:var(--font-display);
  }
  .toast.show{opacity:1;}
  .hint{font-size:11px;color:var(--ink-soft);margin:0 18px 14px;line-height:1.5;}

  /* ---------- HORARIO ---------- */
  .hor-dias-header{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
    padding:0 14px;margin-bottom:8px;
  }
  .hor-dias-header div{
    text-align:center;font-family:var(--font-display);font-weight:700;
    font-size:13px;color:var(--ink-soft);
  }
  .hor-grid{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
    padding:0 14px 6px;
  }
  .hor-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    height:78px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;
  }
  .hor-card.empty{
    background:transparent;border:1px dashed var(--border);cursor:default;
  }
  .hor-card:active{background:var(--accent-wash);}
  .hor-ramo{
    flex:1;display:flex;align-items:center;justify-content:center;
    font-size:9.5px;font-weight:700;text-align:center;color:var(--ink-soft);
    padding:2px 4px;line-height:1.15;
    border-bottom:1px solid var(--border);
    font-family:var(--font-display);
  }
  .hor-sala{
    flex:2;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:800;color:var(--accent-dark);
    font-family:var(--font-display);
  }
  .hor-almuerzo{
    grid-column:1 / -1;
    display:flex;align-items:center;justify-content:center;
    height:26px;margin:2px 0;
  }
  .hor-almuerzo span{
    font-size:10px;font-weight:700;color:var(--ink-soft);
    letter-spacing:0.05em;text-transform:uppercase;
    border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);
    padding:4px 14px;
  }

  .hor-overlay{
    display:none;position:absolute;inset:0;background:rgba(27,42,34,0.45);
    z-index:20;align-items:center;justify-content:center;padding:24px;
  }
  .hor-overlay.show{display:flex;}
  .hor-overlay-card{
    position:relative;background:var(--card);border-radius:var(--radius);
    padding:26px 22px 22px;width:100%;max-width:320px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .hor-overlay-card h2{
    font-family:var(--font-display);font-size:19px;margin:0 0 10px;font-weight:700;
  }
  .hor-overlay-close{
    position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:9px;
    background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;
    transform:rotate(180deg);
  }
  .hor-overlay-close svg{width:16px;height:16px;}
  .hor-line{font-size:13.5px;margin-bottom:8px;color:var(--ink);}
  .hor-line b{color:var(--ink-soft);font-family:var(--font-display);font-weight:700;font-size:12px;}
  #hoHorario{font-weight:700;font-family:var(--font-display);color:var(--accent-dark);margin-bottom:14px;}

  /* ---------- CALENDARIO ---------- */
  .cal-tabs{display:flex;gap:10px;padding:0 18px;margin-bottom:14px;}
  .cal-tab{
    flex:1;padding:14px;border-radius:var(--radius-sm);text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:13.5px;cursor:pointer;
    background:var(--pastel-orange-bg);color:var(--pastel-orange-ink);
  }
  .cal-tab.active{background:var(--pastel-green-bg);color:var(--pastel-green-ink);}

  .ticket{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;}
  .ticket svg{width:14px;height:14px;}
  .cal-fecha-cell{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;}

  .cal-month-card{margin:0 18px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;}
  .cal-month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-month-header h2{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0;text-align:center;flex:1;}
  .cal-arrow{width:32px;height:32px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .cal-arrow svg{width:15px;height:15px;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-family:var(--font-display);font-weight:700;font-size:11px;color:var(--ink-soft);}
  .cal-divider{height:1px;background:var(--border);margin:8px 14px 10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
  }
  .cal-day.empty{cursor:default;}
  .cal-day-green{background:var(--pastel-green-bg);color:var(--pastel-green-ink);}
  .cal-day-orange{background:var(--pastel-orange-bg);color:var(--pastel-orange-ink);}

  .vert-table{margin-bottom:12px;overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--card);}
  .vert-table table{border-collapse:collapse;width:100%;}
  .vert-table th{
    background:var(--th-bg);font-family:var(--font-display);font-size:10px;text-transform:uppercase;
    letter-spacing:0.03em;color:var(--ink-soft);padding:9px 10px;text-align:left;width:74px;
    white-space:nowrap;position:sticky;left:0;
    border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  }
  .vert-table td{
    padding:9px 10px;font-size:13px;text-align:center;min-width:84px;
    border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  }
  .vert-table tr:last-child th, .vert-table tr:last-child td{border-bottom:none;}
  .vert-table td:last-child{border-right:none;}
</style>
</head>
<body>
<div id="phone">
  <div id="scrollArea"></div>
  <nav id="bottomNav"></nav>
  <div class="toast" id="toast"></div>
</div>

<script>
const BLOQUES = [
  {n:1, rango:'8:15–9:35'},
  {n:2, rango:'9:50–11:10'},
  {n:3, rango:'11:25–12:45'},
  {n:4, rango:'13:45–15:05'},
  {n:5, rango:'15:20–16:40'},
  {n:6, rango:'16:55–18:15'},
];

let state = {
  section:'editar',      // editar | horario | promedio | calendario
  view:'list',
  ramoId:null,
  calSubview:'lista',    // lista | calendario
  calYear:null,
  calMonth:null,
  ramos: JSON.parse(localStorage.getItem('ramos_v1') || '[]')
};

const DIAS_ORDEN = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
const DIA_HEADER = {Lunes:'L',Martes:'Ma',Miércoles:'Mi',Jueves:'J',Viernes:'V'};
const DIA_INICIAL = {Lunes:'L',Martes:'M',Miércoles:'W',Jueves:'J',Viernes:'V'};
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function persist(){ localStorage.setItem('ramos_v1', JSON.stringify(state.ramos)); }
function getRamo(){ return state.ramos.find(r=>r.id===state.ramoId); }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}
function uid(){ return 'r'+Math.random().toString(36).slice(2,9); }

const ICONS = {
  home:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>`,
  horario:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/></svg>`,
  plus:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  promedio:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M12 19V5M20 19v-6"/></svg>`,
  calendario:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4M16 3v4"/><rect x="6.5" y="12" width="3" height="3" fill="currentColor" stroke="none"/></svg>`,
  chev:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`,
  back:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  check:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
};

function renderNavOnce(){
  const tabs = [
    {id:'home', icon:ICONS.home, label:'Inicio'},
    {id:'horario', icon:ICONS.horario, label:'Horario'},
    {id:'plus', icon:ICONS.plus, label:'Editar'},
    {id:'promedio', icon:ICONS.promedio, label:'Promedio'},
    {id:'calendario', icon:ICONS.calendario, label:'Calendario'},
  ];
  const nav = document.getElementById('bottomNav');
  nav.innerHTML = tabs.map(t=>`
    <div class="tab" data-nav="${t.id}">
      <div class="icon-wrap">${t.icon}</div>
      <span>${t.label}</span>
    </div>
  `).join('');
  nav.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      if(el.dataset.nav==='plus'){ state.section='editar'; state.view='list'; render(); }
      else if(el.dataset.nav==='horario'){ state.section='horario'; render(); }
      else if(el.dataset.nav==='promedio'){ state.section='promedio'; render(); }
      else if(el.dataset.nav==='calendario'){ state.section='calendario'; state.calSubview='lista'; render(); }
      else toast('Esa sección aún no está construida');
    };
  });
  updateNavActive();
}
function updateNavActive(){
  document.querySelectorAll('#bottomNav .tab').forEach(el=>{
    const isActive =
      (state.section==='editar' && el.dataset.nav==='plus') ||
      (state.section==='horario' && el.dataset.nav==='horario') ||
      (state.section==='promedio' && el.dataset.nav==='promedio') ||
      (state.section==='calendario' && el.dataset.nav==='calendario');
    el.classList.toggle('active', isActive);
  });
}

function render(){
  const c = document.getElementById('scrollArea');
  if(state.section==='horario'){ c.innerHTML = renderHorario(); attachHorarioEvents(); updateNavActive(); return; }
  if(state.section==='promedio'){ c.innerHTML = renderPromedio(); attachPromedioEvents(); updateNavActive(); return; }
  if(state.section==='calendario'){ c.innerHTML = renderCalendarioSection(); attachCalendarioEvents(); updateNavActive(); return; }
  if(state.view==='list') c.innerHTML = renderList();
  else if(state.view==='detail') c.innerHTML = renderDetail();
  else if(state.view==='evaluaciones') c.innerHTML = renderEvaluaciones();
  else if(state.view==='semana') c.innerHTML = renderSemana();
  else if(state.view==='info') c.innerHTML = renderInfo();
  attachEvents();
  updateNavActive();
}

function renderList(){
  const cards = state.ramos.map(r=>`
    <div class="ramo-wrap" data-wrap="${r.id}">
      <div class="ramo-delete-bg" data-delete="${r.id}">Eliminar</div>
      <div class="ramo-card" data-open="${r.id}">
        <div class="name">${escapeHtml(r.nombre)}</div>
        <div class="meta">${r.evaluaciones && r.evaluaciones.length ? r.evaluaciones.length+' evaluaciones' : 'Sin configurar'}</div>
      </div>
    </div>
  `).join('');

  return `
    <header class="header-center">
      <h1>EDITAR RAMOS</h1>
      <div class="sub">Toca un ramo para configurar evaluaciones, horario e información</div>
    </header>
    <main>
      ${cards}
      <div class="add-card" id="addRamoBtn">${ICONS.plus}</div>
    </main>
  `;
}

function renderDetail(){
  const r = getRamo();
  return `
    <div class="topbar">
      <div class="back" data-back="list">${ICONS.back}</div>
      <h2>${escapeHtml(r.nombre)}</h2>
    </div>
    <main style="padding-top:6px;">
      <div class="section-btn" data-go="evaluaciones">
        <div>
          <div class="label">Evaluaciones</div>
          <div class="status ${r.nEval?'ok':''}">${r.nEval? r.nEval+' evaluaciones configuradas' : 'Sin configurar — toca para definir cantidad'}</div>
        </div>
        <div class="chev">${ICONS.chev}</div>
      </div>
      <div class="section-btn" data-go="semana">
        <div>
          <div class="label">Cantidad a la semana</div>
          <div class="status ${r.nSemana?'ok':''}">${r.nSemana? r.nSemana+' bloques a la semana' : 'Sin configurar — toca para definir cantidad'}</div>
        </div>
        <div class="chev">${ICONS.chev}</div>
      </div>
      <div class="section-btn" data-go="info">

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function parsePrefix1(value){
  const m = value.trim().match(/^(.*?)(\d+)$/);
  if(!m) return null;
  const numStr = m[2];
  if(parseInt(numStr,10) !== 1) return null;
  return m[1];
}
function autocompleteTipo(r, startIndex, prefix){
  for(let i=startIndex+1;i<r.evaluaciones.length;i++){
    const row = r.evaluaciones[i];
    const isEmpty = !row.tipo;
    const isSoft = row.tipoSuggested;
    if(isEmpty || isSoft){
      row.tipo = prefix + (i - startIndex + 1);
      row.tipoSuggested = true;
    }
  }
}
function parseUbicacionPrefix(value){
  const m = value.trim().match(/^([^\d]*)(\d*)$/);
  if(!m) return null;
  if(!m[1]) return null;
  return m[1];
}
function autocompleteUbicacion(r, startIndex, prefix){
  for(let i=startIndex+1;i<r.sesiones.length;i++){
    const row = r.sesiones[i];
    const isEmpty = !row.ubicacion;
    const isSoft = row.ubicacionSuggested;
    if(isEmpty || isSoft){
      row.ubicacion = prefix;
      row.ubicacionSuggested = true;
    }
  }
}
function parseNota(raw){
  if(raw===undefined || raw===null || raw.trim()==='') return '';
  let v = raw.trim().replace(',', '.');
  if(/^\d+(\.\d+)?$/.test(v)){
    let num = parseFloat(v);
    if(!raw.includes(',') && !raw.includes('.') && num>=10 && num<=70){
      num = num/10;
    }
    return num.toFixed(1);
  }
  return raw;
}

const SWIPE_OPEN = -84;

function attachSwipeToDelete(){
  let openWrap = null;

  function closeWrap(wrap, animate=true){
    const card = wrap.querySelector('.ramo-card');
    card.style.transition = animate ? 'transform .18s ease' : 'none';
    card.style.transform = 'translateX(0px)';
    wrap.dataset.open = 'false';
    if(openWrap === wrap) openWrap = null;
  }
  function openWrapFn(wrap){
    if(openWrap && openWrap !== wrap) closeWrap(openWrap);
    const card = wrap.querySelector('.ramo-card');
    card.style.transition = 'transform .18s ease';
    card.style.transform = `translateX(${SWIPE_OPEN}px)`;
    wrap.dataset.open = 'true';
    openWrap = wrap;
  }

  document.querySelectorAll('.ramo-wrap').forEach(wrap=>{
    const card = wrap.querySelector('.ramo-card');
    let startX=0, startY=0, currentX=0, dragging=false, decided=null, moved=false;

    card.addEventListener('pointerdown', e=>{
      startX = e.clientX; startY = e.clientY;
      currentX = wrap.dataset.open==='true' ? SWIPE_OPEN : 0;
      dragging = true; decided=null; moved=false;
      card.style.transition = 'none';
      card.setPointerCapture(e.pointerId);
    });

    card.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if(decided===null){
        if(Math.abs(dx) > 6 || Math.abs(dy) > 6){
          decided = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
        }
      }
      if(decided==='h'){
        moved = true;
        let x = currentX + dx;
        x = Math.max(SWIPE_OPEN, Math.min(0, x));
        card.style.transform = `translateX(${x}px)`;
      }
    });

    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      if(decided==='h'){
        const dx = e.clientX - startX;
        const finalX = Math.max(SWIPE_OPEN, Math.min(0, currentX + dx));
        if(finalX < SWIPE_OPEN/2) openWrapFn(wrap); else closeWrap(wrap);
      } else if(!moved){
        // fue un tap: si estaba abierto, ciérralo; si no, abre el ramo
        if(wrap.dataset.open==='true'){ closeWrap(wrap); }
        else { state.ramoId = wrap.dataset.wrap; state.view='detail'; render(); }
      }
    }
    card.addEventListener('pointerup', endDrag);
    card.addEventListener('pointercancel', endDrag);
  });

  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.delete;
      const ramo = state.ramos.find(r=>r.id===id);
      if(confirm(`¿Eliminar "${ramo.nombre}"? Esta acción no se puede deshacer.`)){
        state.ramos = state.ramos.filter(r=>r.id!==id);
        persist(); render();
      }
    };
  });
}

/* Calcula la nota necesaria en las evaluaciones pendientes para llegar
   a un promedio ponderado interno de 3,95 (que redondea a 4,0).
   Devuelve null si ya no quedan evaluaciones pendientes. */
function calcNotaNecesaria(evaluaciones){
  const TARGET = 3.95;
  let sumGraded = 0, weightGraded = 0, weightRemaining = 0;
  evaluaciones.forEach(e=>{
    const w = (parseFloat(e.porcentaje)||0) / 100;
    const notaNum = parseFloat(String(e.nota).replace(',', '.'));
    const tieneNota = !isNaN(notaNum) && e.nota !== '' && e.nota !== '-';
    if(tieneNota){
      sumGraded += notaNum * w;
      weightGraded += w;
    } else {
      weightRemaining += w;
    }
  });
  if(weightRemaining <= 0) return null;
  let raw = (TARGET - sumGraded) / weightRemaining;
  raw = Math.round(raw * 100) / 100;       // evita ruido de punto flotante
  let final = Math.ceil(raw * 10) / 10;    // trunca a 1 decimal y redondea hacia arriba si no cierra
  if(final < 1) final = 1.0;
  return final;
}

function attachPromedioEvents(){
  document.querySelectorAll('[data-prom]').forEach(card=>{
    card.onclick = ()=>{
      const r = state.ramos.find(x=>x.id===card.dataset.prom);
      const evals = r.evaluaciones || [];

      let sumW=0, sumWN=0;
      const lines = evals.map(e=>{
        const w = parseFloat(e.porcentaje) || 0;
        const notaNum = parseFloat(String(e.nota).replace(',', '.'));
        const notaValida = !isNaN(notaNum) && e.nota!=='' && e.nota!=='-';
        if(notaValida){ sumW += w/100; sumWN += notaNum * (w/100); }
        const notaTxt = notaValida ? formatNota(notaNum) : '-';
        return `<div class="hor-line">${escapeHtml(e.tipo || '-')}(${w}%): ${notaTxt}</div>`;
      }).join('');

      const pondActual = sumW>0 ? (sumWN/sumW) : null;
      document.getElementById('promTitulo').textContent =
        `${r.nombre}: ${pondActual!==null ? formatNota(pondActual) : '-'}`;
      document.getElementById('promEvalList').innerHTML =
        lines || '<div class="hint">Sin evaluaciones configuradas.</div>';

      const necesaria = calcNotaNecesaria(evals);
      let necTxt;
      if(necesaria===null) necTxt = 'Curso completo';
      else if(necesaria>7) necTxt = 'No alcanza (necesitas más de 7,0)';
      else necTxt = formatNota(necesaria);
      document.getElementById('promNecesaria').textContent = `Nota necesaria: ${necTxt}`;

      document.getElementById('promOverlay').classList.add('show');
    };
  });
  const overlay = document.getElementById('promOverlay');
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.classList.remove('show'); };
  document.getElementById('promClose').onclick = ()=> overlay.classList.remove('show');
}

/* ============ DATOS: evaluaciones globales (todas las de todos los ramos) ============ */
function getAllEvaluacionesGlobal(){
  let list = [];
  state.ramos.forEach(r=>{
    (r.evaluaciones||[]).forEach(e=>{
      if(e.tipo && e.tipo.trim()!==''){
        list.push({
          ramo:r.nombre, tipo:e.tipo, sala:e.sala||'-', porcentaje:e.porcentaje||'',
          fecha:e.fecha||'', hora:e.hora||''
        });
      }
    });
  });
  list.sort((a,b)=>{
    if(!a.fecha && !b.fecha) return 0;
    if(!a.fecha) return 1;
    if(!b.fecha) return -1;
    return a.fecha.localeCompare(b.fecha);
  });
  return list;
}
function formatFechaCorta(iso){
  if(!iso) return '-';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y.slice(2)}`;
}
function esPasada(iso){
  if(!iso) return false;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const fecha = new Date(iso+'T00:00:00');
  return fecha <= hoy;
}

function renderCalendarioMes(){
  const year = state.calYear, month = state.calMonth;
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startOffset = (firstDay.getDay()+6) % 7; // Lunes=0 ... Domingo=6

  const evalsByDay = {};
  getAllEvaluacionesGlobal().filter(e=>e.fecha).forEach(e=>{
    const d = new Date(e.fecha+'T00:00:00');
    if(d.getFullYear()===year && d.getMonth()===month){
      const day = d.getDate();
      if(!evalsByDay[day]) evalsByDay[day]=[];
      evalsByDay[day].push(e);
    }
  });

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-day empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dayEvals = evalsByDay[day];
    let cls = 'cal-day';
    if(dayEvals && dayEvals.length){
      cls += esPasada(dayEvals[0].fecha) ? ' cal-day-green' : ' cal-day-orange';
    }
    cells += `<div class="${cls}" data-day="${day}">${day}</div>`;
  }

  return `
    <div class="cal-month-card">
      <div class="cal-month-header">
        <div class="cal-arrow" id="calPrev">${ICONS.back}</div>
        <h2>${MESES[month]} ${year}</h2>
        <div class="cal-arrow" id="calNext">${ICONS.chev}</div>
      </div>
      <div class="cal-weekdays">
        <div>L</div><div>Ma</div><div>Mi</div><div>J</div><div>V</div><div>S</div><div>D</div>
      </div>
      <div class="cal-divider"></div>
      <div class="cal-grid">${cells}</div>
    </div>
  `;
}

function attachCalendarioEvents(){
  document.querySelectorAll('.cal-tab').forEach(tab=>{
    tab.onclick = ()=>{
      const sub = tab.dataset.calsub;
      if(sub==='calendario'){
        const hoy = new Date();
        state.calYear = hoy.getFullYear();
        state.calMonth = hoy.getMonth();
      }
      state.calSubview = sub;
      render();
    };
  });

  if(state.calSubview==='lista'){
    document.querySelectorAll('.cal-fecha-cell').forEach(cell=>{
      cell.onclick = ()=>{
        const hora = cell.dataset.hora;
        toast(hora ? `Hora: ${hora}` : 'Sin hora registrada');
      };
    });
  } else {
    document.getElementById('calPrev').onclick = ()=>{
      state.calMonth--; if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
      render();
    };
    document.getElementById('calNext').onclick = ()=>{
      state.calMonth++; if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
      render();
    };
    document.querySelectorAll('.cal-day:not(.empty)').forEach(cell=>{
      cell.onclick = ()=>{
        const day = parseInt(cell.dataset.day,10);
        const evals = getAllEvaluacionesGlobal().filter(e=>{
          if(!e.fecha) return false;
          const d = new Date(e.fecha+'T00:00:00');
          return d.getFullYear()===state.calYear && d.getMonth()===state.calMonth && d.getDate()===day;
        });
        document.getElementById('diaTitulo').textContent = `${day} de ${MESES[state.calMonth]}`;
        document.getElementById('diaContenido').innerHTML = tablaEvaluacionesVertical(evals);
        document.querySelectorAll('#diaContenido .cal-fecha-cell').forEach(cell=>{
          cell.onclick = ()=>{
            const hora = cell.dataset.hora;
            toast(hora ? `Hora: ${hora}` : 'Sin hora registrada');
          };
        });
        document.getElementById('diaOverlay').classList.add('show');
      };
    });
  }

  const overlay = document.getElementById('diaOverlay');
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.classList.remove('show'); };
  document.getElementById('diaClose').onclick = ()=> overlay.classList.remove('show');
}

function attachEvents(){
  if(state.view==='list'){
    document.getElementById('addRamoBtn').onclick = ()=>{
      const nombre = prompt('Nombre del ramo:');
      if(nombre && nombre.trim()){
        state.ramos.push({id:uid(), nombre:nombre.trim(), nEval:0, evaluaciones:[], nSemana:0, sesiones:[], profesor:'', seccion:''});
        persist(); render();
      }
    };
    attachSwipeToDelete();
  }

  if(state.view==='detail'){
    document.querySelector('[data-back]').onclick = ()=>{ state.view='list'; render(); };
    document.querySelectorAll('[data-go]').forEach(el=>{
      el.onclick = ()=>{ state.view = el.dataset.go; render(); };
    });
  }

  if(state.view==='evaluaciones'){
    document.querySelector('[data-back]').onclick = ()=>{ state.view='detail'; render(); };
    const r = getRamo();
    if(!r.nEval){
      document.getElementById('crearEvalTabla').onclick = ()=>{
        const n = parseInt(document.getElementById('nEvalInput').value,10);
        if(!n || n<1){ toast('Ingresa un número válido'); return; }
        r.nEval = n;
        r.evaluaciones = Array.from({length:n}, ()=>({tipo:'',nota:'',porcentaje:'',fecha:'',hora:'',sala:''}));
        persist(); render();
      };
      return;
    }
    document.querySelectorAll('#evalBody tr').forEach(tr=>{
      const i = parseInt(tr.dataset.row,10);
      tr.querySelectorAll('input').forEach(input=>{
        const field = input.dataset.field;
        input.addEventListener('focus', ()=> input.select());
        input.addEventListener('blur', ()=>{
          const row = r.evaluaciones[i];
          if(field==='tipo'){
            row.tipo = input.value;
            row.tipoSuggested = false;
            const prefix = parsePrefix1(input.value);
            if(prefix!==null) autocompleteTipo(r, i, prefix);
          } else if(field==='nota'){
            row.nota = parseNota(input.value) || (input.value.trim()==='' ? '-' : input.value);
          } else if(field==='sala'){
            row.sala = input.value.trim()==='' ? '-' : input.value;
          } else if(field==='porcentaje'){
            row.porcentaje = input.value;
          } else if(field==='fecha'){
            row.fecha = input.value;
          } else if(field==='hora'){
            row.hora = input.value;
          }
          persist(); render();
        });
      });
    });
    document.getElementById('cambiarN').onclick = ()=>{
      const n = parseInt(prompt('Nueva cantidad de evaluaciones:', r.nEval),10);
      if(!n || n<1) return;
      const nuevo = Array.from({length:n}, (_,i)=> r.evaluaciones[i] || {tipo:'',nota:'',porcentaje:'',fecha:'',hora:'',sala:''});
      r.nEval = n; r.evaluaciones = nuevo; persist(); render();
    };
    document.getElementById('guardarEval').onclick = ()=>{
      const suma = r.evaluaciones.reduce((s,row)=> s + (parseFloat(row.porcentaje)||0), 0);
      const warnDiv = document.getElementById('evalWarn');
      if(Math.round(suma) !== 100){
        warnDiv.innerHTML = `<div class="warn">Los porcentajes suman ${suma}%. Deben sumar 100% antes de guardar.</div>`;
      } else {
        warnDiv.innerHTML = '';
        persist(); toast('Evaluaciones guardadas'); state.view='detail'; render();
      }
    };
  }

  if(state.view==='semana'){
    document.querySelector('[data-back]').onclick = ()=>{ state.view='detail'; render(); };
    const r = getRamo();
    if(!r.nSemana){
      document.getElementById('crearSemTabla').onclick = ()=>{
        const n = parseInt(document.getElementById('nSemInput').value,10);
        if(!n || n<1){ toast('Ingresa un número válido'); return; }
        r.nSemana = n;
        r.sesiones = Array.from({length:n}, ()=>({dia:'',bloque:'1',ubicacion:'',tipo:'T'}));
        persist(); render();
      };
      return;
    }
    document.querySelectorAll('#semBody tr').forEach(tr=>{
      const i = parseInt(tr.dataset.row,10);
      tr.querySelectorAll('input,select').forEach(input=>{
        const field = input.dataset.field;
        if(input.tagName==='INPUT'){
          input.addEventListener('focus', ()=> input.select());
        }
        input.addEventListener('blur', ()=>{
          const row = r.sesiones[i];
          if(field==='ubicacion'){
            row.ubicacion = input.value;
            row.ubicacionSuggested = false;
            const prefix = parseUbicacionPrefix(input.value);
            if(prefix) autocompleteUbicacion(r, i, prefix);
          } else if(field==='bloque'){
            row.bloque = input.value || '1';
          } else if(field==='dia'){
            row.dia = input.value;
          } else if(field==='tipo'){
            row.tipo = input.value;
          }
          persist(); render();
        });
        if(input.tagName==='SELECT'){
          input.addEventListener('change', ()=> input.blur());
        }
      });
    });
    document.getElementById('cambiarNSem').onclick = ()=>{
      const n = parseInt(prompt('Nueva cantidad a la semana:', r.nSemana),10);
      if(!n || n<1) return;
      const nuevo = Array.from({length:n}, (_,i)=> r.sesiones[i] || {dia:'',bloque:'1',ubicacion:'',tipo:'T'});
      r.nSemana = n; r.sesiones = nuevo; persist(); render();
    };
    document.getElementById('guardarSem').onclick = ()=>{
      persist(); toast('Horario guardado'); state.view='detail'; render();
    };
  }

  if(state.view==='info'){
    document.querySelector('[data-back]').onclick = ()=>{ state.view='detail'; render(); };
    document.getElementById('guardarInfo').onclick = ()=>{
      const r = getRamo();
      r.profesor = document.getElementById('profInput').value.trim();
      r.seccion = document.getElementById('seccInput').value.trim();
      persist(); toast('Información guardada'); state.view='detail'; render();
    };
  }
}

renderNavOnce();
render();
</script>
