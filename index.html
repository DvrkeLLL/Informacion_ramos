<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ramos U — Editar Ramos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5F1;
    --ink:#1B2A22;
    --ink-soft:#5E6E63;
    --accent:#2F6E4E;
    --accent-dark:#215239;
    --accent-wash:rgba(47,110,78,0.12);
    --on-accent:#FFFFFF;
    --danger:#B5473A;
    --card:#FFFFFF;
    --border:#D9E0D6;
    --th-bg:#E9EEE6;
    --radius:20px;
    --radius-sm:14px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#DEE3DA;font-family:var(--font-body);color:var(--ink);}
  #phone{
    max-width:430px;
    margin:0 auto;
    height:100vh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,0.15);
  }
  #scrollArea{
    flex:1;
    overflow-y:auto;
    padding-bottom:104px;
  }

  header{ padding:34px 22px 16px; }
  header h1{
    font-family:var(--font-display);
    font-size:27px;
    font-weight:800;
    letter-spacing:0.01em;
    margin:0;
    color:var(--ink);
  }
  header .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:5px; }

  main{ padding:6px 18px 0; }
  .ramo-wrap{
    position:relative;
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
  }
  .ramo-delete-bg{
    position:absolute;
    inset:0;
    background:var(--danger);
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:22px;
    color:#fff;
    font-weight:700;
    font-family:var(--font-display);
    font-size:13px;
    cursor:pointer;
  }
  .ramo-card, .add-card{
    min-height:84px;
    border-radius:var(--radius);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    transition:transform .12s ease;
    touch-action:pan-y;
    position:relative;
  }
  .ramo-card{
    background:var(--card);
    border:1px solid var(--border);
    padding:14px 18px;
  }
  .ramo-card:active{transform:none;}
  .ramo-card .name{font-weight:700;font-size:15.5px;font-family:var(--font-display);}
  .ramo-card .meta{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  .add-card{
    border:2px solid var(--accent);
    color:var(--accent-dark);
    background:var(--accent-wash);
    margin-bottom:12px;
  }
  .add-card svg{width:26px;height:26px;}
  .add-card:active{background:var(--accent);color:#fff;}

  nav{
    position:absolute;
    left:16px; right:16px; bottom:16px;
    display:flex;
    background:var(--ink);
    border-radius:26px;
    padding:10px 8px;
    box-shadow:0 10px 30px rgba(27,42,34,0.35);
    z-index:10;
  }
  nav .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    color:rgba(255,255,255,0.55);
    cursor:pointer;
    font-size:9.5px;
    font-weight:700;
    font-family:var(--font-display);
  }
  nav .tab svg{width:20px;height:20px;}
  nav .tab.active{color:#fff;}
  nav .icon-wrap{
    width:38px;height:28px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
  }
  nav .tab.active .icon-wrap{background:var(--accent);}

  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:20px 18px 10px;
  }
  .back{
    width:36px;height:36px;border-radius:12px;
    border:1px solid var(--border);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--ink);
    flex-shrink:0;
  }
  .back svg{width:20px;height:20px;display:block;}
  .topbar h2{font-family:var(--font-display);font-size:19px;margin:0;font-weight:700;}

  .section-btn{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;margin:0 18px 12px;
    display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;
  }
  .section-btn .label{font-weight:700;font-size:14.5px;font-family:var(--font-display);}
  .section-btn .status{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .section-btn .status.ok{color:var(--accent-dark);font-weight:600;}

  .inline-form{margin:0 18px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .inline-form label{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .inline-form input, .inline-form select{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:14.5px;font-family:var(--font-body);margin-bottom:12px;background:#fff;color:var(--ink);
  }
  .btn-primary{
    background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius-sm);
    padding:13px 16px;font-weight:700;font-family:var(--font-display);font-size:14px;cursor:pointer;width:100%;
  }
  .btn-primary:active{background:var(--accent-dark);}
  .btn-ghost{
    background:transparent;color:var(--ink-soft);border:1.5px solid var(--border);
    border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-display);
  }

  .table-wrap{margin:0 18px 14px;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);}
  table{border-collapse:collapse;width:100%;min-width:560px;}
  th{
    background:var(--th-bg);font-size:10.5px;text-transform:uppercase;letter-spacing:0.03em;
    color:var(--ink-soft);padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);
    position:sticky;top:0;font-family:var(--font-display);
  }
  td{padding:6px 8px;border-bottom:1px solid var(--border);font-size:13px;}
  td input, td select{
    width:100%;border:1px solid transparent;background:transparent;font-size:13px;
    padding:6px 5px;border-radius:9px;font-family:var(--font-body);color:var(--ink);
  }
  td input:focus, td select:focus{border-color:var(--accent);background:#fff;outline:none;}
  td input.suggested{color:var(--ink-soft);font-style:italic;}
  .num-cell{color:var(--ink-soft);font-weight:700;text-align:center;width:34px;}
  .fecha-cell{display:flex;flex-direction:column;gap:5px;min-width:126px;padding:6px 4px;}
  .fecha-cell input{
    padding:7px 6px;font-size:12px;
    border:1px solid var(--border) !important;
    background:#fff !important;
    -webkit-appearance:none;
    appearance:none;
    color:var(--ink);
  }

  .save-bar{margin:0 18px 24px;display:flex;gap:10px;}
  .save-bar .btn-primary{flex:1;}
  .warn{
    margin:0 18px 14px;background:#FBEAE7;border:1px solid var(--danger);color:var(--danger);
    padding:11px 12px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;
  }
  .toast{
    position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;
    font-family:var(--font-display);
  }
  .toast.show{opacity:1;}
  .hint{font-size:11px;color:var(--ink-soft);margin:0 18px 14px;line-height:1.5;}
</style>
</head>
<body>
<div id="phone">
  <div id="scrollArea"></div>
  <nav id="bottomNav"></nav>
  <div class="toast" id="toast"></div>
</div>

<script>
const BLOQUES = [
  {n:1, rango:'8:15–9:35'},
  {n:2, rango:'9:50–11:10'},
  {n:3, rango:'11:25–12:45'},
  {n:4, rango:'13:45–15:05'},
  {n:5, rango:'15:20–16:40'},
  {n:6, rango:'16:55–18:15'},
];

let state = {
  view:'list',
  ramoId:null,
  ramos: JSON.parse(localStorage.getItem('ramos_v1') || '[]')
};

function persist(){ localStorage.setItem('ramos_v1', JSON.stringify(state.ramos)); }
function getRamo(){ return state.ramos.find(r=>r.id===state.ramoId); }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}
function uid(){ return 'r'+Math.random().toString(36).slice(2,9); }

const ICONS = {
  home:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>`,
  horario:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/></svg>`,
  plus:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  promedio:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M12 19V5M20 19v-6"/></svg>`,
  calendario:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4M16 3v4"/><rect x="6.5" y="12" width="3" height="3" fill="currentColor" stroke="none"/></svg>`,
  chev:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`,
  back:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
};

function renderNavOnce(){
  const tabs = [
    {id:'home', icon:ICONS.home, label:'Inicio'},
    {id:'horario', icon:ICONS.horario, label:'Horario'},
    {id:'plus', icon:ICONS.plus, label:'Editar'},
    {id:'promedio', icon:ICONS.promedio, label:'Promedio'},
    {id:'calendario', icon:ICONS.calendario, label:'Calendario'},
  ];
  const nav = document.getElementById('bottomNav');
  nav.innerHTML = tabs.map(t=>`
    <div class="tab" data-nav="${t.id}">
      <div class="icon-wrap">${t.icon}</div>
      <span>${t.label}</span>
    </div>
  `).join('');
  nav.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      if(el.dataset.nav==='plus'){ state.view='list'; render(); }
      else toast('Esa sección aún no está construida');
    };
  });
  updateNavActive();
}
function updateNavActive(){
  document.querySelectorAll('#bottomNav .tab').forEach(el=>{
    el.classList.toggle('active', el.dataset.nav==='plus');
  });
}

function render(){
  const c = document.getElementById('scrollArea');
  if(state.view==='list') c.innerHTML = renderList();
  else if(state.view==='detail') c.innerHTML = renderDetail();
  else if(state.view==='evaluaciones') c.innerHTML = renderEvaluaciones();
  else if(state.view==='semana') c.innerHTML = renderSemana();
  else if(state.view==='info') c.innerHTML = renderInfo();
  attachEvents();
  updateNavActive();
}

function renderList(){
  const cards = state.ramos.map(r=>`
    <div class="ramo-wrap" data-wrap="${r.id}">
      <div class="ramo-delete-bg" data-delete="${r.id}">Eliminar</div>
      <div class="ramo-card" data-open="${r.id}">
        <div class="name">${escapeHtml(r.nombre)}</div>
        <div class="meta">${r.evaluaciones && r.evaluaciones.length ? r.evaluaciones.length+' evaluaciones' : 'Sin configurar'}</div>
      </div>
    </div>
  `).join('');

  return `
    <header>
      <h1>EDITAR RAMOS</h1>
      <div class="sub">Toca un ramo para configurar evaluaciones, horario e información</div>
    </header>
    <main>
      ${cards}
      <div class="add-card" id="addRamoBtn">${ICONS.plus}</div>
    </main>
  `;
}

function renderDetail(){
  const r = getRamo();
  return `
    <div class="topbar">
      <div class="back" data-back="list">${ICONS.back}</div>
      <h2>${escapeHtml(r.nombre)}</h2>
    </div>
    <main style="padding-top:6px;">
      <div class="section-btn" data-go="evaluaciones">
        <div>
          <div class="label">Evaluaciones</div>
          <div class="status ${r.nEval?'ok':''}">${r.nEval? r.nEval+' evaluaciones configuradas' : 'Sin configurar — toca para definir cantidad'}</div>
        </div>
        <div class="chev">${ICONS.chev}</div>
      </div>
      <div class="section-btn" data-go="semana">
        <div>
          <div class="label">Cantidad a la semana</div>
          <div class="status ${r.nSemana?'ok':''}">${r.nSemana? r.nSemana+' bloques a la semana' : 'Sin configurar — toca para definir cantidad'}</div>
        </div>
        <div class="chev">${ICONS.chev}</div>
      </div>
      <div class="section-btn" data-go="info">
        <div>
          <div class="label">Información Ramo</div>
          <div class="status ${(r.profesor||r.seccion)?'ok':''}">${r.profesor? r.profesor : 'Profesor y sección'}</div>
        </div>
        <div class="chev">${ICONS.chev}</div>
      </div>
    </main>
  `;
}

function renderEvaluaciones(){
  const r = getRamo();
  if(!r.nEval){
    return `
      <div class="topbar">
        <div class="back" data-back="detail">${ICONS.back}</div>
        <h2>Evaluaciones</h2>
      </div>
      <div class="inline-form">
        <label>¿Cuántas evaluaciones tiene este ramo? (n)</label>
        <input type="number" min="1" id="nEvalInput" placeholder="ej: 4">
        <button class="btn-primary" id="crearEvalTabla">Crear tabla</button>
      </div>
    `;
  }
  const rows = r.evaluaciones.map((row,i)=>`
    <tr data-row="${i}">
      <td class="num-cell">${i+1}</td>
      <td><input type="text" data-field="tipo" class="${row.tipoSuggested?'suggested':''}" value="${escapeHtml(row.tipo||'')}" placeholder="ej: PEP 1"></td>
      <td><input type="text" data-field="nota" value="${escapeHtml(row.nota||'')}" placeholder="-" style="width:56px;"></td>
      <td><input type="number" data-field="porcentaje" value="${row.porcentaje||''}" placeholder="%" style="width:56px;"></td>
      <td class="fecha-cell">
        <input type="date" data-field="fecha" value="${row.fecha||''}">
        <input type="time" data-field="hora" value="${row.hora||''}">
      </td>
      <td><input type="text" data-field="sala" value="${escapeHtml(row.sala||'')}" placeholder="-" style="width:56px;"></td>
    </tr>
  `).join('');

  return `
    <div class="topbar">
      <div class="back" data-back="detail">${ICONS.back}</div>
      <h2>Evaluaciones</h2>
    </div>
    <div class="hint">Escribe un nombre terminado en "1" (ej. "PEP 1") y las filas siguientes se sugieren automáticamente. Puedes escribir directo encima de una sugerencia.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>N</th><th>Tipo de prueba</th><th>Nota</th><th>%</th><th>Fecha</th><th>Sala</th></tr></thead>
        <tbody id="evalBody">${rows}</tbody>
      </table>
    </div>
    <div id="evalWarn"></div>
    <div class="save-bar">
      <button class="btn-ghost" id="cambiarN">Cambiar n</button>
      <button class="btn-primary" id="guardarEval">Guardar</button>
    </div>
  `;
}

function renderSemana(){
  const r = getRamo();
  if(!r.nSemana){
    return `
      <div class="topbar">
        <div class="back" data-back="detail">${ICONS.back}</div>
        <h2>Cantidad a la semana</h2>
      </div>
      <div class="inline-form">
        <label>Cantidad a la semana (n)</label>
        <input type="number" min="1" id="nSemInput" placeholder="ej: 3">
        <button class="btn-primary" id="crearSemTabla">Crear tabla</button>
      </div>
    `;
  }
  const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
  const rows = r.sesiones.map((row,i)=>`
    <tr data-row="${i}">
      <td class="num-cell">${i+1}</td>
      <td>
        <select data-field="dia">
          <option value="">—</option>
          ${DIAS.map(d=>`<option value="${d}" ${row.dia===d?'selected':''}>${d}</option>`).join('')}
        </select>
      </td>
      <td>
        <select data-field="bloque">
          ${BLOQUES.map(b=>`<option value="${b.n}" ${String(row.bloque)===String(b.n)?'selected':''}>${b.n}</option>`).join('')}
        </select>
      </td>
      <td><input type="text" data-field="ubicacion" class="${row.ubicacionSuggested?'suggested':''}" value="${escapeHtml(row.ubicacion||'')}" placeholder="ej: ED604" style="width:80px;"></td>
      <td>
        <select data-field="tipo">
          <option value="E" ${row.tipo==='E'?'selected':''}>E</option>
          <option value="L" ${row.tipo==='L'?'selected':''}>L</option>
          <option value="T" ${row.tipo==='T'?'selected':''}>T</option>
        </select>
      </td>
    </tr>
  `).join('');

  return `
    <div class="topbar">
      <div class="back" data-back="detail">${ICONS.back}</div>
      <h2>Cantidad a la semana</h2>
    </div>
    <div class="hint">Bloque siempre trae un valor por defecto (revisa la tabla de horarios si necesitas ver el rango). Escribe la parte de texto de la ubicación (ej. "ED") y se sugiere en las filas vacías; el número lo completas tú en cada fila.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>N</th><th>Día</th><th>Bloque</th><th>Ubicación</th><th>Tipo</th></tr></thead>
        <tbody id="semBody">${rows}</tbody>
      </table>
    </div>
    <div class="save-bar">
      <button class="btn-ghost" id="cambiarNSem">Cambiar n</button>
      <button class="btn-primary" id="guardarSem">Guardar</button>
    </div>
  `;
}

function renderInfo(){
  const r = getRamo();
  return `
    <div class="topbar">
      <div class="back" data-back="detail">${ICONS.back}</div>
      <h2>Información Ramo</h2>
    </div>
    <div class="inline-form">
      <label>Nombre del profesor</label>
      <input type="text" id="profInput" value="${escapeHtml(r.profesor||'')}" placeholder="ej: Juan Pérez">
      <label>Sección</label>
      <input type="text" id="seccInput" value="${escapeHtml(r.seccion||'')}" placeholder="ej: 2">
      <button class="btn-primary" id="guardarInfo">Guardar</button>
    </div>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function parsePrefix1(value){
  const m = value.trim().match(/^(.*?)(\d+)$/);
  if(!m) return null;
  const numStr = m[2];
  if(parseInt(numStr,10) !== 1) return null;
  return m[1];
}
function autocompleteTipo(r, startIndex, prefix){
  for(let i=startIndex+1;i<r.evaluaciones.length;i++){
    const row = r.evaluaciones[i];
    const isEmpty = !row.tipo;
    const isSoft = row.tipoSuggested;
    if(isEmpty || isSoft){
      row.tipo = prefix + (i - startIndex + 1);
      row.tipoSuggested = true;
    }
  }
}
function parseUbicacionPrefix(value){
  const m = value.trim().match(/^([^\d]*)(\d*)$/);
  if(!m) return null;
  if(!m[1]) return null;
  return m[1];
}
function autocompleteUbicacion(r, startIndex, prefix){
  for(let i=startIndex+1;i<r.sesiones.length;i++){
    const row = r.sesiones[i];
    const isEmpty = !row.ubicacion;
    const isSoft = row.ubicacionSuggested;
    if(isEmpty || isSoft){
      row.ubicacion = prefix;
      row.ubicacionSuggested = true;
    }
  }
}
function parseNota(raw){
  if(raw===undefined || raw===null || raw.trim()==='') return '';
  let v = raw.trim().replace(',', '.');
  if(/^\d+(\.\d+)?$/.test(v)){
    let num = parseFloat(v);
    if(!raw.includes(',') && !raw.includes('.') && num>=10 && num<=70){
      num = num/10;
    }
    return num.toFixed(1);
  }
  return raw;
}

const SWIPE_OPEN = -84;

function attachSwipeToDelete(){
  let openWrap = null;

  function closeWrap(wrap, animate=true){
    const card = wrap.querySelector('.ramo-card');
    card.style.transition = animate ? 'transform .18s ease' : 'none';
    card.style.transform = 'translateX(0px)';
    wrap.dataset.open = 'false';
    if(openWrap === wrap) openWrap = null;
  }
  function openWrapFn(wrap){
    if(openWrap && openWrap !== wrap) closeWrap(openWrap);
    const card = wrap.querySelector('.ramo-card');
    card.style.transition = 'transform .18s ease';
    card.style.transform = `translateX(${SWIPE_OPEN}px)`;
    wrap.dataset.open = 'true';
    openWrap = wrap;
  }

  document.querySelectorAll('.ramo-wrap').forEach(wrap=>{
    const card = wrap.querySelector('.ramo-card');
    let startX=0, startY=0, currentX=0, dragging=false, decided=null, moved=false;

    card.addEventListener('pointerdown', e=>{
      startX = e.clientX; startY = e.clientY;
      currentX = wrap.dataset.open==='true' ? SWIPE_OPEN : 0;
      dragging = true; decided=null; moved=false;
      card.style.transition = 'none';
      card.setPointerCapture(e.pointerId);
    });

    card.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if(decided===null){
        if(Math.abs(dx) > 6 || Math.abs(dy) > 6){
          decided = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
        }
      }
      if(decided==='h'){
        moved = true;
        let x = currentX + dx;
        x = Math.max(SWIPE_OPEN, Math.min(0, x));
        card.style.transform = `translateX(${x}px)`;
      }
    });

    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      if(decided==='h'){
        const dx = e.clientX - startX;
        const finalX = Math.max(SWIPE_OPEN, Math.min(0, currentX + dx));
        if(finalX < SWIPE_OPEN/2) openWrapFn(wrap); else closeWrap(wrap);
      } else if(!moved){
        // fue un tap: si estaba abierto, ciérralo; si no, abre el ramo
        if(wrap.dataset.open==='true'){ closeWrap(wrap); }
        else { state.ramoId = wrap.dataset.wrap; state.view='detail'; render(); }
      }
    }
    card.addEventListener('pointerup', endDrag);
    card.addEventListener('pointercancel', endDrag);
  });

  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.delete;
      const ramo = state.ramos.find(r=>r.id===id);
      if(confirm(`¿Eliminar "${ramo.nombre}"? Esta acción no se puede deshacer.`)){
        state.ramos = state.ramos.filter(r=>r.id!==id);
        persist(); render();
      }
    };
  });
}

function attachEvents(){
  if(state.view==='list'){
    document.getElementById('addRamoBtn').onclick = ()=>{
      const nombre = prompt('Nombre del ramo:');
      if(nombre && nombre.trim()){
        state.ramos.push({id:uid(), nombre:nombre.trim(), nEval:0, evaluaciones:[], nSemana:0, sesiones:[], profesor:'', seccion:''});
        persist(); render();
      }
    };
    attachSwipeToDelete();
  }

  if(state.view==='detail'){
    document.querySelector('[data-back]').onclick = ()=>{ state.view='list'; render(); };
    document.querySelectorAll('[data-go]').forEach(el=>{
      el.onclick = ()=>{ state.view = el.dataset.go; render(); };
    });
  }

  if(state.view==='evaluaciones'){
    document.querySelector('[data-back]').onclick = ()=>{ state.view='detail'; render(); };
    const r = getRamo();
    if(!r.nEval){
      document.getElementById('crearEvalTabla').onclick = ()=>{
        const n = parseInt(document.getElementById('nEvalInput').value,10);
        if(!n || n<1){ toast('Ingresa un número válido'); return; }
        r.nEval = n;
        r.evaluaciones = Array.from({length:n}, ()=>({tipo:'',nota:'',porcentaje:'',fecha:'',hora:'',sala:''}));
        persist(); render();
      };
      return;
    }
    document.querySelectorAll('#evalBody tr').forEach(tr=>{
      const i = parseInt(tr.dataset.row,10);
      tr.querySelectorAll('input').forEach(input=>{
        const field = input.dataset.field;
        input.addEventListener('focus', ()=> input.select());
        input.addEventListener('blur', ()=>{
          const row = r.evaluaciones[i];
          if(field==='tipo'){
            row.tipo = input.value;
            row.tipoSuggested = false;
            const prefix = parsePrefix1(input.value);
            if(prefix!==null) autocompleteTipo(r, i, prefix);
          } else if(field==='nota'){
            row.nota = parseNota(input.value) || (input.value.trim()==='' ? '-' : input.value);
          } else if(field==='sala'){
            row.sala = input.value.trim()==='' ? '-' : input.value;
          } else if(field==='porcentaje'){
            row.porcentaje = input.value;
          } else if(field==='fecha'){
            row.fecha = input.value;
          } else if(field==='hora'){
            row.hora = input.value;
          }
          persist(); render();
        });
      });
    });
    document.getElementById('cambiarN').onclick = ()=>{
      const n = parseInt(prompt('Nueva cantidad de evaluaciones:', r.nEval),10);
      if(!n || n<1) return;
      const nuevo = Array.from({length:n}, (_,i)=> r.evaluaciones[i] || {tipo:'',nota:'',porcentaje:'',fecha:'',hora:'',sala:''});
      r.nEval = n; r.evaluaciones = nuevo; persist(); render();
    };
    document.getElementById('guardarEval').onclick = ()=>{
      const suma = r.evaluaciones.reduce((s,row)=> s + (parseFloat(row.porcentaje)||0), 0);
      const warnDiv = document.getElementById('evalWarn');
      if(Math.round(suma) !== 100){
        warnDiv.innerHTML = `<div class="warn">Los porcentajes suman ${suma}%. Deben sumar 100% antes de guardar.</div>`;
      } else {
        warnDiv.innerHTML = '';
        persist(); toast('Evaluaciones guardadas'); state.view='detail'; render();
      }
    };
  }

  if(state.view==='semana'){
    document.querySelector('[data-back]').onclick = ()=>{ state.view='detail'; render(); };
    const r = getRamo();
    if(!r.nSemana){
      document.getElementById('crearSemTabla').onclick = ()=>{
        const n = parseInt(document.getElementById('nSemInput').value,10);
        if(!n || n<1){ toast('Ingresa un número válido'); return; }
        r.nSemana = n;
        r.sesiones = Array.from({length:n}, ()=>({dia:'',bloque:'1',ubicacion:'',tipo:'T'}));
        persist(); render();
      };
      return;
    }
    document.querySelectorAll('#semBody tr').forEach(tr=>{
      const i = parseInt(tr.dataset.row,10);
      tr.querySelectorAll('input,select').forEach(input=>{
        const field = input.dataset.field;
        if(input.tagName==='INPUT'){
          input.addEventListener('focus', ()=> input.select());
        }
        input.addEventListener('blur', ()=>{
          const row = r.sesiones[i];
          if(field==='ubicacion'){
            row.ubicacion = input.value;
            row.ubicacionSuggested = false;
            const prefix = parseUbicacionPrefix(input.value);
            if(prefix) autocompleteUbicacion(r, i, prefix);
          } else if(field==='bloque'){
            row.bloque = input.value || '1';
          } else if(field==='dia'){
            row.dia = input.value;
          } else if(field==='tipo'){
            row.tipo = input.value;
          }
          persist(); render();
        });
        if(input.tagName==='SELECT'){
          input.addEventListener('change', ()=> input.blur());
        }
      });
    });
    document.getElementById('cambiarNSem').onclick = ()=>{
      const n = parseInt(prompt('Nueva cantidad a la semana:', r.nSemana),10);
      if(!n || n<1) return;
      const nuevo = Array.from({length:n}, (_,i)=> r.sesiones[i] || {dia:'',bloque:'1',ubicacion:'',tipo:'T'});
      r.nSemana = n; r.sesiones = nuevo; persist(); render();
    };
    document.getElementById('guardarSem').onclick = ()=>{
      persist(); toast('Horario guardado'); state.view='detail'; render();
    };
  }

  if(state.view==='info'){
    document.querySelector('[data-back]').onclick = ()=>{ state.view='detail'; render(); };
    document.getElementById('guardarInfo').onclick = ()=>{
      const r = getRamo();
      r.profesor = document.getElementById('profInput').value.trim();
      r.seccion = document.getElementById('seccInput').value.trim();
      persist(); toast('Información guardada'); state.view='detail'; render();
    };
  }
}

renderNavOnce();
render();
</script>
</body>
</html>
